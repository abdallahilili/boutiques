# Configuration Supabase locale (https://supabase.com/docs/guides/local-development/cli/config)
project_id = "boutiques"

[api]
enabled = true
port = 54321
# Seul `public` est exposé : les helpers internes vivent dans le schéma `prive`.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Limite globale ; les buckets (product-images, shop-assets, payment-proofs) sont créés par migration.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://127.0.0.1:5174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Aucune inscription publique : les comptes sont créés par les Edge Functions (service_role).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Connexion publique (téléphone + code) : appelée avant toute session.
[functions.connexion_telephone_pin]
verify_jwt = false

[functions.inscription-cliente]
verify_jwt = false

# Les autres fonctions vérifient le JWT puis les droits (super_admin, propriétaire…).
[functions.admin-create-merchant]
verify_jwt = true

[functions.invite-member]
verify_jwt = true

[functions.reset-pin]
verify_jwt = true

[functions.changer-code]
verify_jwt = true

[functions.send-notification]
verify_jwt = true

[functions.admin-create-staff]
verify_jwt = true

[analytics]
enabled = false
